# ===================================
# Database Configuration
# ===================================
# Read DB connection from environment variables. Use DB_USER/DB_PASS and DB_URL provided by the host.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ipl_db}
spring.datasource.username=${DB_USER:ipl_user}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# JPA / Hibernate Configuration
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================
# Server Configuration
# ===================================
server.port=${PORT:8080}

# ===================================
# App Name
# ===================================
spring.application.name=ipl-team-manager
